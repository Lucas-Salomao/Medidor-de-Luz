name: Build and Release ESP32 Firmware

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Build firmware
        run: |
          docker run --rm -v $GITHUB_WORKSPACE:/project -w /project espressif/idf:v5.0.1 /bin/bash -c "idf.py set-target esp32s3 && idf.py build"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Bootloader
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/bootloader/bootloader.bin
          asset_name: bootloader.bin
          asset_content_type: application/octet-stream

      - name: Upload Partitions
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/partition_table/partition-table.bin
          asset_name: partition-table.bin
          asset_content_type: application/octet-stream

      - name: Upload Firmware
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/ESP32-S3-Touch-LCD-2.bin
          asset_name: firmware.bin
          asset_content_type: application/octet-stream
